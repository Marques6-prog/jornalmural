<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">

      <!-- Customized Bootstrap Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
      <!--Css style sheet-->
    <link rel="stylesheet" href="css/registration.css">
    <link rel="stylesheet" href="font-awesome 4/font-awesome.css">
    <title>Login</title>
  </head>
  <body>
    <!--Start of Login Page-->

    <section class="login">  
      <div class="container">
        <div class="row justify-content-center align-items-center">
          <div class="col-lg-6 login-card">
            <div class="content">
              <header>
                <h1 class="m-0 display-6 text-uppercase text-primary">Trans<span class="text-secondary font-weight-normal">Marques(8)</span></h1>
                <h4>Olá, vamos começar!</h1>
                <p>Entre para continuar</p>
              </header>
              
              <form>
                <div class="form-group">
                  <input
                    type="email"
                    placeholder="Email.."
                    class="form-control my-3 p-4"
                  />
                </div>
                <div class="form-group">
                  <input
                    type="password"
                    placeholder="*******"
                    class="form-control my-3 p-4"
                  />
                </div>
                <span style="margin-bottom: 20px;">No mínimo 8 caracteres, pelo menos uma letra maiúscula, uma letra minúscula, um número e um caractere especial ex: @$!%*?&.
                </span>
                <div class="form-group">
                  <div class="form-check" id="formcheck">
                    <input
                      class="fomr-check-input"
                      type="checkbox"
                      value=""
                      id="flexcheck"
                    />
                    <label class="form-check-label" for="flexcheck"> 
                       Me mantem logado 
                    </label>
                  </div>
                  <a href="index.html" class="btn1">Entrar</a>
                </div>
                <p class="text-center">Não possuí uma conta? <a href="sign up.html">Crie uma conta.</a> <br>
                  <a href="#">Esqueceu a senha?</a>
               </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
      integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
