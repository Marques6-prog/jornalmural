<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
    <!--Css Links-->
    <link rel="stylesheet" href="css/sign_up.css"/>
    <link rel="stylesheet" href="font-awesome 4/font-awesome.css" />
    <title>Sign up</title>
  </head>
  <body>
    <!--Start of Login Page-->

    <section class="login">
      <div class="container">
        <div class="row justify-content-center align-items-center">
          <div class="col-lg-7 login-card">
            <div class="content">
              <header>
                <h1 class="m-0 display-6 text-uppercase text-primary">JORNAL<span class="text-secondary font-weight-normal">MURALCAF</span></h1>
                <h4>Olá, vamos começar!</h4>
                <p class="font-weight-light">Entre para continuar</p>
              </header>

              <form>
                <div class="form-group">
                  <input
                    type="nome"
                    placeholder="Nome.."
                    class="form-control"
                  />
                </div>
                <div class="form-group">
                  <input
                    type="Nome de usuario"
                    placeholder="Nome de usuario"
                    class="form-control "
                  />
                </div>
                <div class="form-group">
                    <input
                      type="email"
                      placeholder="Email.."
                      class="form-control"
                    />
                  </div>
                  <div class="form-group">
                    <input
                      type="password"
                      placeholder="Senha"
                      class="form-control"
                    />
                  </div>
                  <div class="form-group">
                    <input
                      type="password"
                      placeholder="Confirme Senha"
                      class="form-control"
                    />
                  </div>
                  <a href="index.html" class="btn1">Criar conta</a>
                </div>
                <p class="text-center"><a href="login.html"> Já possuí uma conta?</a></p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
      integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
